<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciamento de idiomas</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            background: #11151b;
        }

        .content-card {
            background-color: #1b212b;
            border: 1px solid #343b47;
            box-shadow: 0 .75rem 2rem rgba(0, 0, 0, .22);
        }

        .form-control:focus {
            border-color: #f8f9fa;
            box-shadow: 0 0 0 .25rem rgba(248, 249, 250, .15);
        }

        .btn {
            transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
        }

        .btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 .35rem .8rem rgba(0, 0, 0, .25);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .table > :not(caption) > * > * {
            padding: .9rem .75rem;
            border-color: #343b47;
        }
    </style>
</head>
<body class="text-light">
<main class="container py-4 py-md-5">
    <header class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
        <div>
            <p class="text-uppercase text-secondary fw-semibold small mb-1">Sakila</p>
            <h1 class="h3 mb-1">Idiomas</h1>
            <p class="text-secondary mb-0">Consulte e gerencie os idiomas disponíveis no catálogo.</p>
        </div>
        <a class="btn btn-light fw-semibold px-4" href="#language-form" th:if="${!editing}">
            + Incluir idioma
        </a>
    </header>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <section class="card content-card mb-4" id="language-form">
        <div class="card-body p-3 p-md-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h5 mb-0" th:text="${editing} ? 'Editar idioma' : 'Incluir idioma'">Incluir idioma</h2>
                <span class="badge text-bg-secondary" th:if="${editing}"
                      th:text="|ID ${languageForm.languageId}|">ID</span>
            </div>

            <form method="post" th:object="${languageForm}"
                  th:action="${editing} ? @{/languages/{id}(id=${languageForm.languageId})} : @{/languages}"
                  class="row g-3 align-items-start">
                <div class="col-12 col-md-8 col-lg-9">
                    <label class="form-label" for="name">Nome do idioma</label>
                    <input class="form-control form-control-lg bg-dark text-light"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           id="name" type="text" th:field="*{name}" maxlength="20" required
                           autocomplete="off" placeholder="Ex.: Português" aria-describedby="name-help name-error">
                    <div class="form-text" id="name-help">Use até 20 caracteres.</div>
                    <div class="invalid-feedback" id="name-error" th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">Nome inválido.</div>
                </div>
                <div class="col-12 col-md-4 col-lg-3 d-grid gap-2 d-md-flex pt-md-4">
                    <button class="btn btn-light btn-lg flex-fill fw-semibold" type="submit"
                            th:text="${editing} ? 'Salvar' : 'Incluir'">Incluir</button>
                    <a class="btn btn-outline-light btn-lg" th:if="${editing}" th:href="@{/languages}">Cancelar</a>
                </div>
            </form>
        </div>
    </section>

    <section class="card content-card">
        <div class="card-header bg-transparent border-secondary-subtle d-flex align-items-center justify-content-between p-3 p-md-4">
            <h2 class="h5 mb-0">Idiomas cadastrados</h2>
            <span class="badge rounded-pill text-bg-light" th:text="${#lists.size(languages)}">0</span>
        </div>

        <div class="card-body p-4 text-center" th:if="${#lists.isEmpty(languages)}">
            <p class="text-secondary mb-0">Nenhum idioma cadastrado.</p>
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(languages)}">
            <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col" class="ps-3 ps-md-4">ID</th>
                    <th scope="col">Idioma</th>
                    <th scope="col" class="d-none d-lg-table-cell">Última atualização</th>
                    <th scope="col" class="text-end pe-3 pe-md-4">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="language : ${languages}">
                    <td class="ps-3 ps-md-4 text-secondary" th:text="${language.languageId}">1</td>
                    <td class="fw-semibold" th:text="${language.name}">English</td>
                    <td class="d-none d-lg-table-cell text-secondary"
                        th:text="${language.lastUpdate != null ? #dates.format(language.lastUpdate, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
                    <td class="text-end pe-3 pe-md-4">
                        <div class="d-inline-flex flex-wrap justify-content-end gap-2">
                            <a class="btn btn-sm btn-outline-light"
                               th:href="@{/languages/{id}/edit(id=${language.languageId})}"
                               th:aria-label="|Editar ${language.name}|">Editar</a>
                            <form method="post" class="d-inline"
                                  th:action="@{/languages/{id}/delete(id=${language.languageId})}"
                                  onsubmit="return confirm('Confirma a exclusão deste idioma?');">
                                <button class="btn btn-sm btn-light text-danger border-danger" type="submit"
                                        th:aria-label="|Excluir ${language.name}|">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}" src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
